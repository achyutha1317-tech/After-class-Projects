<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Onjects Data Structure and Array</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <h2>JavaScript Objects Data Structure and Array</h2>

    <script>
        //1. Create an onject variable
        var student = {
            name: "Riya",
            age: "12",
            Grade: "7",
            hobbies: "Drawing",
            fav_sport: "Cricket",
        };

        //2, Create an array variable
        var color = ["white", "black", "red", "green", "blue"];

        //3. Print some of the onject properties by accessing their keys
        document.write("Student name is: " + student.name, "<br>", "student favorite sport is: " + student.fav_sport);

        //4. Print the array by joining a special character in between 
        document.write("<br><br>Before Poping the colors are: " + color.join("^"));

        //5. Print an array and print it with a new joining character

        document.write("<br>My favorite color is: " + color[3]);

        //6. Pop the array and print it with a new joining character
        color.pop();
        document.write("<br><br>After Poping the colors are: " + color.join("*"));

    </script>


</body>
</html>
